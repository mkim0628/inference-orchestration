experiment:
  date: "2026-05-22"
  activity: "A+B+C"
  description: >
    C-3 DapQPositionAwareEvictionCodec (position-aware pseudo query based KV eviction) +
    B-1 SessionAwareTurnLevelSegmentCache (session-aware turn-level non-contiguous segment cache) +
    Cross-2 DapQSessionSegmentDualReductionPipeline (B+C dual reduction pipeline) +
    A-1 PPDAppendFullPrefillClassifier (append/full-prefill classifier router, auxiliary).
    Based on DapQ (arXiv 2603.11564) position-aware principle.
  cache_type: dapq_session_segment_dual_pipeline
  compression_method: dapq_position_aware_eviction
  scheduler_type: ppd_append_full_prefill_classifier

dapq_eviction_codec:  # C-3
  d_head: 128
  n_kv_heads: 8
  n_layers: 12
  budget_ratio: 0.30            # default: keep top 30% KV
  high_pressure_threshold: 0.80
  low_pressure_threshold: 0.50
  high_pressure_budget_ratio: 0.15
  low_pressure_budget_ratio: 0.50
  recent_window: 32             # always keep last 32 tokens
  use_unit_template: true       # minimize semantic info (DapQ principle)
  max_entries: 1000
  seed: 42

session_turn_level_segment_cache:  # B-1
  chunk_size: 128
  max_entries: 1000
  max_turns_per_session: 10
  session_lru_penalty: 0.5
  seed: 42

dual_reduction_pipeline:  # Cross-2
  segment_keep_ratio: 0.50      # Step 2: select top 50% segments
  kv_budget_ratio: 0.30         # Step 3: keep top 30% KV within selected segments
  decay_factor: 512.0

ppd_classifier:  # A-1
  append_threshold: 0.15        # new_token_ratio <= 0.15 → append-prefill
  slo_headroom_threshold_ms: 30.0
  session_ttl_seconds: 3600.0
  seed: 42

benchmark:
  accuracy:
    method: "attention_output_proxy"
    dataset_proxy: "wikitext2_synthetic"
    task_accuracy_proxy: "niah_cosine_similarity"
    relative_error_max: 0.01        # ±1% (evaluation_criteria.md §4 MANDATORY)
    cosine_similarity_min: 0.99     # (evaluation_criteria.md §4 MANDATORY)
    kl_divergence_max: 0.015        # auxiliary metric
    budget_ratios_to_test: [1.00, 0.50, 0.30, 0.15, 0.03]
    niah_context_lengths: [256, 512, 1024]  # proxy: 32K/64K/128K scale
    longbench_subtask_count: 8
    ablation_unit_vs_semantic_template: true  # position-aware vs semantic query contrast
  activity_b:
    cache_hit_rate_improvement_min_pct: 5.0   # +5%p (§3 high priority)
    noncontiguous_hit_rate_min_pct: 30.0      # >= 30% of total hits (§3 high priority)
    memory_footprint_max_increase_pct: 20.0   # <= +20% (§3 high priority)
  activity_a:
    scheduling_overhead_ttft_p50_max_pct: 5.0  # <= +5% (§2 MANDATORY)
    cache_hit_rate_improvement_min_pct: 10.0   # +10%p (§2 high priority)
  activity_c:
    memory_reduction_min: 0.30      # -30% or more (§4 high priority)
    effective_context_multiplier: 2.0
    compression_overhead_ttft_max_pct: 10.0
  cross_bc:
    throughput_min_improvement_vs_solo: 5.0   # +5% vs single Activity (§5 high priority)
    memory_min_improvement_vs_solo: 10.0      # -10% vs single Activity (§5 high priority)
    accuracy_cosine_min: 0.99                 # C included (§5 MANDATORY)
    comparison_methods: ["solo_b1", "solo_c3", "cross_bc"]
  throughput:
    target_improvement_pct: 20      # +20% vs baseline (§1 long-term goal)

seed: 42
results_dir: "results/2026-05-22"
