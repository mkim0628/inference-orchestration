# T_recompute / (T_recompute + T_s3) per context length
# Values derived from ObjectCache paper (5.6% TTFT baseline) back-calculation.
# Calibrate with configs/objectcache_breakeven_calibration.py in production.
breakeven_table:
  4096:  0.15
  8192:  0.18
  16384: 0.22
  32768: 0.28
  65536: 0.35

s3_endpoint: "http://localhost:9000"   # MinIO test endpoint
s3_bucket: "kvcache"
rdma_target: "gpu-node-0"
